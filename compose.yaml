name: ${PILOT_PROJECT_NAME:-seafoodeck-pilot}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .local/pilot.env}
      POSTGRES_USER: ${POSTGRES_USER:?Generate .local/pilot.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .local/pilot.env}
    volumes: [pilot_db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    restart: unless-stopped
  storage-config:
    image: chrislusf/seaweedfs:4.20@sha256:cea8339d21dad1b200adce581dd7434d254b8f5975f142c3b4c930ba78647eef
    user: '0:0'
    entrypoint: ['/bin/sh', '-ec']
    command: ['umask 077; cp /input/s3.json /config/s3.json; chown 1000:1000 /config/s3.json; chmod 600 /config/s3.json']
    volumes:
      - ./.local/s3.json:/input/s3.json:ro
      - pilot_storage_config:/config
    mem_limit: 32m
    restart: 'no'
  storage:
    image: chrislusf/seaweedfs:4.20@sha256:cea8339d21dad1b200adce581dd7434d254b8f5975f142c3b4c930ba78647eef
    command: [server, '-s3', '-filer', '-ip=storage', '-ip.bind=0.0.0.0', '-dir=/data', '-s3.config=/etc/seaweedfs/auth/s3.json', '-master.volumeSizeLimitMB=256', '-volume.max=4', '-s3.allowedOrigins=${PUBLIC_ORIGIN}${STUDIO_ORIGIN:+,${STUDIO_ORIGIN}}']
    volumes:
      - pilot_storage:/data
      - pilot_storage_config:/etc/seaweedfs/auth:ro
    depends_on: {storage-config: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped
  migrate:
    platform: linux/amd64
    image: seafoodeck-api:${API_TAG:-pilot-internal-20261118-r2}
    build: {context: ., dockerfile: apps/api/Dockerfile, args: {RELEASE_TAG: "${API_TAG:-pilot-internal-20261118-r2}"}}
    env_file: ['${PILOT_ENV_FILE:-.local/pilot.env}']
    command: [npx, prisma, migrate, deploy]
    depends_on: {db: {condition: service_healthy}}
    restart: 'no'
  api:
    platform: linux/amd64
    image: seafoodeck-api:${API_TAG:-pilot-internal-20261118-r2}
    build: {context: ., dockerfile: apps/api/Dockerfile, args: {RELEASE_TAG: "${API_TAG:-pilot-internal-20261118-r2}"}}
    env_file: ['${PILOT_ENV_FILE:-.local/pilot.env}']
    depends_on: {migrate: {condition: service_completed_successfully}, storage: {condition: service_healthy}}
    mem_limit: 320m
    pids_limit: 128
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  web:
    platform: linux/amd64
    image: seafoodeck-web:${WEB_TAG:-pilot-internal-20261118-r2}
    build: {context: ., dockerfile: apps/web/Dockerfile, args: {RELEASE_TAG: "${WEB_TAG:-pilot-internal-20261118-r2}"}}
    environment: {SITE_ADDRESS: '${SITE_ADDRESS:-:80}',S3_BUCKET: '${S3_BUCKET:-seafoodeck-private}'}
    ports: ['127.0.0.1:${WEB_PORT:-18089}:80']
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 96m
    restart: unless-stopped
  seed:
    platform: linux/amd64
    image: seafoodeck-api:${API_TAG:-pilot-internal-20261118-r2}
    profiles: [internal-seed]
    env_file: ['${PILOT_ENV_FILE:-.local/pilot.env}']
    environment: {INTERNAL_SEED_DIR: /fixtures, INTERNAL_SEED_COUNT: '${INTERNAL_SEED_COUNT:-6}'}
    volumes: ['./test-fixtures:/fixtures:ro']
    command: [node, dist/seed.js]
    depends_on: {api: {condition: service_healthy}}
volumes:
  pilot_db:
  pilot_storage:
  pilot_storage_config:
