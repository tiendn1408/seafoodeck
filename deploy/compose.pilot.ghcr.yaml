# Run from repo root with --project-directory . and -f deploy/compose.pilot.ghcr.yaml.
name: ${PILOT_PROJECT_NAME:-seafoodeck-pilot}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .local/pilot.env}
      POSTGRES_USER: ${POSTGRES_USER:?Generate .local/pilot.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .local/pilot.env}
    volumes: [pilot_db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    restart: unless-stopped
  storage:
    image: chrislusf/seaweedfs:4.20@sha256:cea8339d21dad1b200adce581dd7434d254b8f5975f142c3b4c930ba78647eef
    command: [server, '-s3', '-filer', '-ip=storage', '-ip.bind=0.0.0.0', '-dir=/data', '-s3.config=/etc/seaweedfs/s3.json', '-master.volumeSizeLimitMB=256', '-volume.max=4', '-s3.allowedOrigins=${PUBLIC_ORIGIN}']
    volumes:
      - pilot_storage:/data
      - ./.local/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9333/cluster/status]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped
  migrate:
    platform: linux/amd64
    image: ${API_IMAGE_REF:?Set API_IMAGE_REF in .local/pilot.env}
    env_file: ['./.local/pilot.env']
    command: [npx, prisma, migrate, deploy]
    depends_on: {db: {condition: service_healthy}}
    restart: 'no'
  api:
    platform: linux/amd64
    image: ${API_IMAGE_REF:?Set API_IMAGE_REF in .local/pilot.env}
    env_file: ['./.local/pilot.env']
    depends_on: {migrate: {condition: service_completed_successfully}, storage: {condition: service_healthy}}
    mem_limit: 320m
    pids_limit: 128
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  web:
    platform: linux/amd64
    image: ${WEB_IMAGE_REF:?Set WEB_IMAGE_REF in .local/pilot.env}
    environment: {SITE_ADDRESS: '${SITE_ADDRESS:-:80}',S3_BUCKET: '${S3_BUCKET:-seafoodeck-private}'}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: {api: {condition: service_healthy}}
    mem_limit: 96m
    restart: unless-stopped
volumes:
  pilot_db:
  pilot_storage:
  caddy_data:
  caddy_config:
