# Run from repo root with --project-directory . and -f deploy/compose.pilot.ghcr.yaml.
name: ${PILOT_PROJECT_NAME:-seafoodeck-pilot}

# Settings shared by edge, web-learner and web-studio.
x-web-tier: &web-tier
  platform: linux/amd64  # release images are amd64 (the VPS)
  restart: unless-stopped
  mem_limit: 96m
  logging:  # Caddy access/error logs: never fill the disk
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
# Same healthcheck intent as compose.yaml. There is no start_period: the images carry a 30 s HEALTHCHECK,
# and interval 5s x retries 20 gives each container 100 s to come up, which covers Caddy's start-up, so
# `edge` (waiting on both web containers) starts within seconds of them.
x-web-tier-health: &web-tier-health
  interval: 5s
  timeout: 3s
  retries: 20

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .local/pilot.env}
      POSTGRES_USER: ${POSTGRES_USER:?Generate .local/pilot.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .local/pilot.env}
    volumes: [pilot_db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    restart: unless-stopped
  storage-config:
    image: chrislusf/seaweedfs:4.20@sha256:cea8339d21dad1b200adce581dd7434d254b8f5975f142c3b4c930ba78647eef
    user: '0:0'
    entrypoint: ['/bin/sh', '-ec']
    command: ['umask 077; cp /input/s3.json /config/s3.json; chown 1000:1000 /config/s3.json; chmod 600 /config/s3.json']
    volumes:
      - ./.local/s3.json:/input/s3.json:ro
      - pilot_storage_config:/config
    mem_limit: 32m
    restart: 'no'
  storage:
    image: chrislusf/seaweedfs:4.20@sha256:cea8339d21dad1b200adce581dd7434d254b8f5975f142c3b4c930ba78647eef
    command: [server, '-s3', '-filer', '-ip=storage', '-ip.bind=0.0.0.0', '-dir=/data', '-s3.config=/etc/seaweedfs/auth/s3.json', '-master.volumeSizeLimitMB=256', '-volume.max=4', '-s3.allowedOrigins=${PUBLIC_ORIGIN}${STUDIO_ORIGIN:+,${STUDIO_ORIGIN}}']
    volumes:
      - pilot_storage:/data
      - pilot_storage_config:/etc/seaweedfs/auth:ro
    depends_on: {storage-config: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped
  migrate:
    platform: linux/amd64
    image: ${API_IMAGE_REF:?Set API_IMAGE_REF in .local/pilot.env}
    env_file: ['./.local/pilot.env']
    command: [npx, prisma, migrate, deploy]
    depends_on: {db: {condition: service_healthy}}
    restart: 'no'
  api:
    platform: linux/amd64
    image: ${API_IMAGE_REF:?Set API_IMAGE_REF in .local/pilot.env}
    env_file: ['./.local/pilot.env']
    depends_on: {migrate: {condition: service_completed_successfully}, storage: {condition: service_healthy}}
    mem_limit: 320m
    pids_limit: 128
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  # Web tier: `edge` is the only way in (ports 80/443, TLS, headers, /api/*, S3 proxy, Studio guard) and proxies
  # the rest by host to `web-learner` or `web-studio`, each holding one app build only. Three images, three
  # digests (EDGE_IMAGE_REF, LEARNER_IMAGE_REF, STUDIO_IMAGE_REF) so either app can roll back alone.
  # Switching from the old single `web` container: it still owns 80/443, so remove it first
  # (`docker rm -f <project>-web-1`), then `up -d edge web-learner web-studio`. Never `down -v`.
  edge:
    <<: *web-tier
    image: ${EDGE_IMAGE_REF:?Set EDGE_IMAGE_REF in .local/pilot.env}
    # Unset STUDIO_SITE_ADDRESS -> placeholder host (Studio site off); an empty value would break the Caddyfile.
    environment: {SITE_ADDRESS: '${SITE_ADDRESS:-:80}',STUDIO_SITE_ADDRESS: '${STUDIO_SITE_ADDRESS:-http://studio.invalid}',S3_BUCKET: '${S3_BUCKET:-seafoodeck-private}'}
    # The only published ports of the stack. 443/udp is HTTP/3.
    ports: ['80:80', '443:443', '443:443/udp']
    # Same volumes the old `web` mounted: certificates and ACME state survive the switch.
    volumes: [caddy_data:/data, caddy_config:/config]
    healthcheck:
      <<: *web-tier-health
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
    depends_on:
      api: {condition: service_healthy}
      web-learner: {condition: service_healthy}
      web-studio: {condition: service_healthy}
  # web-learner / web-studio: plain HTTP on the compose network only, no ports, no volumes.
  web-learner:
    <<: *web-tier
    image: ${LEARNER_IMAGE_REF:?Set LEARNER_IMAGE_REF in .local/pilot.env}
    healthcheck:
      <<: *web-tier-health
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/healthz']
  web-studio:
    <<: *web-tier
    image: ${STUDIO_IMAGE_REF:?Set STUDIO_IMAGE_REF in .local/pilot.env}
    healthcheck:
      <<: *web-tier-health
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/healthz']
volumes:
  pilot_db:
  pilot_storage:
  pilot_storage_config:
  caddy_data:
  caddy_config:
